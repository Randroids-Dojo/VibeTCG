# ---------------------------------------------------------------
# Scenarios: multi-step deterministic traces.
# ---------------------------------------------------------------

scenarios:

  - scenario_id: full-match-trace
    name: a deterministic trace of an entire match
    notes: |
      See examples/sample-match-trace.yaml for the full step-by-step expected log.
      An implementation passes this scenario iff it reproduces the same winner and
      the same per-turn (health.player, health.cpu) snapshots at the listed checkpoints.
    setup:
      from_op: match.init
      input:
        config: *default_config
        seed: 42
        deckP: *deck_2_of_each
        deckC: *deck_2_of_each
      then:
        - op: match.dealOpeningHands
    checkpoints_file: examples/sample-match-trace.yaml
