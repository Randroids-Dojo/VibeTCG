# Theme-Agnostic Card Battler: Test Cases
# ---------------------------------------------------------------
# Schema: see tests-schema.md (companion). Quick reference:
#   cases: list of case objects
#   each case has: case_id, operation, setup, [action], checks
#   each check has: { path, op, value } where op is one of:
#     equals      | not_equals
#     count       (length of array at path equals value)
#     gte | lte   (numeric)
#     contains    (array at path contains value as a member)
#     truthy      (value is truthy; ignores `value` field)
#     event_kind  (events array contains event with this kind; value is partial-match payload)
#     event_order (events array contains these kinds in this order; value is list of kinds)
#     throws      (operation throws an error matching value as substring; check has no `path`)
# ---------------------------------------------------------------

version: gdd-2026-05-23
schema: 1

defaults:
  config: &default_config
    startingHealth: 20
    startingHandSize: 3
    resourceCap: 6
    activeUnitReplaceRule: discard_previous
    deckOutCausesLoss: true
    maxHandSize: null
    firstPlayer: player

  deck_2_of_each: &deck_2_of_each
    - unit_striker
    - unit_striker
    - unit_guardian
    - unit_guardian
    - unit_charger
    - unit_charger
    - action_spark
    - action_spark
    - action_mend
    - action_mend
    - action_surge
    - action_surge

cases:

  # -------------------------------------------------------------
  # match.init
  # -------------------------------------------------------------

  - case_id: init.starting-state
    operation: match.init
    setup:
      input:
        config: *default_config
        seed: 1
        deckP: *deck_2_of_each
        deckC: *deck_2_of_each
    checks:
      - { path: state.phase, op: equals, value: StartTurn }
      - { path: state.activePlayerId, op: equals, value: player }
      - { path: state.turnNumber, op: equals, value: 0 }
      - { path: state.winner, op: equals, value: null }
      - { path: state.players.player.health, op: equals, value: 20 }
      - { path: state.players.cpu.health, op: equals, value: 20 }
      - { path: state.players.player.currentResource, op: equals, value: 0 }
      - { path: state.players.player.maxResource, op: equals, value: 0 }
      - { path: state.players.player.resourceCap, op: equals, value: 6 }
      - { path: state.players.player.deck, op: count, value: 12 }
      - { path: state.players.cpu.deck, op: count, value: 12 }
      - { path: state.players.player.hand, op: count, value: 0 }
      - { path: state.players.player.discard, op: count, value: 0 }
      - { path: state.players.player.activeUnit, op: equals, value: null }

  - case_id: init.determinism-same-seed
    operation: match.init
    setup:
      input:
        config: *default_config
        seed: 12345
        deckP: *deck_2_of_each
        deckC: *deck_2_of_each
    notes: |
      Run twice with the same seed and config. Decks must be in identical order.
      Implementations: run init twice and compare deck arrays via deep equality.
    checks:
      - { path: state.players.player.deck, op: count, value: 12 }
      - { path: state.players.cpu.deck, op: count, value: 12 }

  - case_id: init.rejects-zero-starting-health
    operation: match.init
    setup:
      input:
        config:
          startingHealth: 0
          startingHandSize: 3
          resourceCap: 6
          activeUnitReplaceRule: discard_previous
          deckOutCausesLoss: true
          maxHandSize: null
          firstPlayer: player
        seed: 1
        deckP: *deck_2_of_each
        deckC: *deck_2_of_each
    checks:
      - { op: throws, value: startingHealth }

  - case_id: init.rejects-unknown-card-id
    operation: match.init
    setup:
      input:
        config: *default_config
        seed: 1
        deckP: [unit_striker, unknown_card]
        deckC: *deck_2_of_each
    checks:
      - { op: throws, value: unknown_card }

  # -------------------------------------------------------------
  # match.dealOpeningHands
  # -------------------------------------------------------------

  - case_id: deal.opening-hand-size
    operation: match.dealOpeningHands
    setup:
      from_op: match.init
      input:
        config: *default_config
        seed: 1
        deckP: *deck_2_of_each
        deckC: *deck_2_of_each
    checks:
      - { path: state.players.player.hand, op: count, value: 3 }
      - { path: state.players.cpu.hand, op: count, value: 3 }
      - { path: state.players.player.deck, op: count, value: 9 }
      - { path: state.players.cpu.deck, op: count, value: 9 }
      - { path: state.phase, op: equals, value: StartTurn }
      - { path: events, op: event_order, value: [CARD_DRAWN, CARD_DRAWN, CARD_DRAWN, CARD_DRAWN, CARD_DRAWN, CARD_DRAWN] }

  - case_id: deal.short-deck-no-deckout
    operation: match.dealOpeningHands
